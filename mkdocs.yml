site_name: Java Programs Documentation
site_description: Lightweight documentation for testing TechDocs
site_author: Anu Nema
repo_url: https://github.com/Anunema/Java-Programs-

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tabs

nav:
  - Home: index.md
  - Getting Started:
    - Introduction: getting-started/intro.md
    - Installation: getting-started/installation.md
  - Java Basics:
    - Hello World: basics/hello-world.md
    - Variables: basics/variables.md
  - Advanced Topics:
    - OOP Concepts: advanced/oop.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
